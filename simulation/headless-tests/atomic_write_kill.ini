; PhoenicisNex — IMPL-046 Atomic-Write Spike (Evolution E1 risk gate)
;                + IMPL-064 live-taskkill harness reuse (fix-round-12 §12.1+§12.4)
;
; Standalone Spike_AtomicWrite.mq5 exercises ADR-007 Option A
; (write-temp + rename) atomic write contract. Two consumers share the .ini:
;
;   (a) IMPL-046 sandbox spike — Phase 1 (1000 writes) + Phase 2 (100
;       software-simulated mid-write crashes) entirely from OnInit. Verdict
;       logged via Print: [spike][ev=spike_complete][verdict=...]
;   (b) IMPL-064 PowerShell harness (atomic_write_kill_100.ps1) — launches
;       terminal64.exe with this .ini, races a Stop-Process kill against
;       the spike's write loop, then inspects state.json integrity.
;
; The [TesterInputs] section below redirects the spike from the original
; sandbox path (PhoenicisNex/spike/state.json) to the production path
; (PhoenicisNex/state/state.json) so the harness's inspect path matches
; the spike's write path (fix-round-12 § 12.1 CRITICAL). InpKillTrials=0
; disables the spike's internal Phase 2 so the external PowerShell kill
; alone owns the kill semantics (fix-round-12 § 12.4). InpTotalWrites is
; bumped so the random 50-500ms attack window lands inside an active write
; iteration (fix-round-12 § 12.3 — paired with harness poll-then-attack).
;
; Reference: ADR-007 §Spike Result, TD-02 §13.6 PR contract,
;            docs/state/nfr-3.1-atomic-write-result.md § 2.3.

[Tester]
Expert=PhoenicisNex\spike\Spike_AtomicWrite
Symbol=EURUSD
Period=H4
Model=2
Optimization=0
FromDate=2021.01.04
ToDate=2021.01.05
Deposit=1000
Leverage=500
ShutdownTerminal=1
Visual=0

[TesterInputs]
; fix-round-12 § 12.1 — redirect spike write path to production state path
;   so atomic_write_kill_100.ps1 inspects the same file the spike writes.
InpStateFile=PhoenicisNex/state/state.json
InpTmpFile=PhoenicisNex/state/state.json.tmp
; fix-round-12 § 12.3 — large enough that random 50-500ms harness attack
;   window always lands inside an active write iteration.
InpTotalWrites=100000
; fix-round-12 § 12.4 — disable spike's internal Phase 2 (software-simulated
;   crashes); the external PowerShell kill alone owns kill semantics for
;   IMPL-064. IMPL-046 sandbox usage runs the .mq5 directly without this .ini.
InpKillTrials=0
