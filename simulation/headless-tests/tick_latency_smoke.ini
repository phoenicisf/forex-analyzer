; PhoenicisNex — Tick Latency Probe Structural Pre-Drain (IMPL-FIX-003)
; fix-round-18 §18.5 — structural pre-drain plan from review-round-17 §17.7
; reaffirmed by review-round-18 §18.5.
;
; Purpose:
;   Empirically validate the post-fix-round-17 §17.2 invariant
;     m_count[TLPROBE_STAGE_ENTRY] < m_count[TLPROBE_STAGE_REFRESH]
;   under non-zero tick load BEFORE the operator burns hours of 5-yr
;   regression backtest. Compresses measurement-instrument regression
;   discovery from ~3h to ~10min wall-clock.
;
; Expert binary:
;   PhoenicisNex_TickLatencyProbe.ex5 (the ENABLE_TICK_LATENCY build)
;   produced by compiling MQL5/Experts/PhoenicisNex/
;     PhoenicisNex_TickLatencyProbe.mq5 (NOT the production .mq5).
;
; Window:
;   2024.01.02 → 2024.01.05 (3-day H4 ≈ 18 bars + every-tick model fill);
;   crosses at least one EET morning-window cycle so the morning_block
;   gate fires at least once.
;
; Drain:
;   1. Compile PhoenicisNex_TickLatencyProbe.mq5 (G1 must show 0/0).
;   2. Run this .ini via run_headless_backtest.sh.
;   3. iconv UTF-16LE → UTF-8 the Tester log; grep "[ev=tick_latency_*]".
;   4. Assert ≥1 final_deinit emit; parse stage table:
;        grep tick_latency_report tester.log | grep -oE "stage=[a-z_]+ n=[0-9]+"
;   5. Confirm n[entry_pass] < n[refresh] AND n[entry_pass] > 0
;      (proves entry-pass tick stream is skipped at least once but is
;      still hit during the window).
;   6. Mark structural half of IMPL-065 paired E-AC `[x]` in the
;      deferred-AC registry with this .ini's run timestamp.

[Tester]
Expert=PhoenicisNex\PhoenicisNex_TickLatencyProbe
Symbol=EURUSD
Period=H4
Model=4
Optimization=0
FromDate=2024.01.02
ToDate=2024.01.05
Deposit=1000
Leverage=500
ShutdownTerminal=1
Visual=0

;
; fix-round-19 §19.4 — pin TimeGate inputs to lock the assertion
; contract n[entry_pass] < n[refresh] AND n[entry_pass] > 0.
; Without pinning, an operator with a stale .set file or default-
; overridden inputs may see entry-gate fire every tick (false-FAIL)
; or never fire (false-PASS). All values match the source defaults
; in MQL5/Experts/PhoenicisNex/inputs/Inputs_TimeGates.mqh so the
; assertion contract matches code-baseline behavior.
;
[TesterInputs]
InpMorningWindowMinutes=5
InpMondaySpreadThreshold=10
InpHolidayStartMonth=12
InpHolidayStartDay=21
InpHolidayEndMonth=1
InpHolidayEndDay=3
InpBanCCooldownBars=5
InpBanLCooldownBars=5
InpBanMCooldownBars=5
InpKLastOrderCooldownBars=4
InpGPauseCooldownBars=3
;
; fix-round-20 §20.4 — pin per-slot enables (TD-02 §13.6 reproducibility).
; Note: the STAGE_ENTRY probe at core/Orchestrator.mqh:665 sits OUTSIDE the
; per-slot iteration loop (RunEntryPass is wrapped by StageStart/StageEnd),
; so n[entry_pass] is independent of slot enables in the current probe
; topology. Pinning these defensively for two reasons:
;   1. TD-02 §13.6 reproducibility — every input affecting EA behaviour during
;      the assertion window MUST be pinned so a stale .set file cannot drift.
;   2. Future-proof against probe-relocation: if a future change moves the
;      probe inside the iteration loop, n[entry_pass] would become enable-
;      gated and an unpinned .set could false-FAIL the assertion.
; All values match source defaults in MQL5/Experts/PhoenicisNex/inputs/
; Inputs_Slot_*.mqh so behaviour matches code-baseline.
InpEnableSlotC=true
InpEnableSlotD=true
InpEnableSlotF=true
InpEnableSlotJ=true
InpEnableSlotH=true
InpEnableSlotK=true
InpEnableSlotG=true
InpEnableSlotG2=true
InpEnableSlotGO=true
InpEnableSlotI=true
InpEnableSlotM=true
InpEnableSlotL=true
InpEnableSlotLX=true
InpEnableSlotQ=true
InpEnableSlotR=true
InpEnableSlotP=true
InpEnableSlotT=true
InpEnableSlotS=true
InpEnableSlotB=true
InpEnableSlotBR=true
InpEnableSlotBI=true
;
; Logging level pinned so [ev=tick_latency_report] (INFO severity) is emitted.
; Default already 1 (INFO) per Inputs_Logging.mqh:9 — pinned for explicitness.
InpLogLevel=1
