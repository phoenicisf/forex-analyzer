# ANDM Full Track — recommended Codex CLI project config
#
# Codex layers config (highest precedence first):
#   1. CLI flags / --config overrides
#   2. --profile <name> values
#   3. Project: .codex/config.toml (this file, walked from cwd → repo root)
#   4. User: ~/.codex/config.toml
#   5. System: /etc/codex/config.toml
#   6. Built-in defaults
#
# Full Track is QA-heavy and produces large structured docs (BA, SD, TD, UX, QA Plan,
# impl-plan, claim-reviews). Keep reasoning effort high and require approval before
# Codex runs anything outside the workspace sandbox.

model = "gpt-5.5"
model_reasoning_effort = "high"
model_reasoning_summary = "auto"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Cached web search keeps cite-able external context cheap during BA/SD research.
web_search = "cached"

[agents]
# Phase 1.5 fan-out (e.g. /ba-review, /sd-review, /td-review, /ux-review) typically
# spawns 1 subagent per target doc. Six concurrent threads cover the largest
# deliverable sets (SD has 6 docs in v1.2).
max_concurrent_threads = 6
