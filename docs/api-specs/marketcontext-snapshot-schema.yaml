# MarketContext Immutable Snapshot Schema (intra-process contract)
#
# PhoenicisNex local-only EA — schema for the `domain/MarketContext` struct
# built once per tick by `services/MarketContextBuilder::Build()` (ADR-004),
# passed as `const MarketContext &ctx` to slot Evaluate / ManageExits methods.
#
# This is NOT an external API — it's the canonical field list for:
#   1. MQL5 struct member declarations (TD Phase 1D)
#   2. Trade journal `indicator_snapshot` field subset (per FR-4.1)
#   3. QA test stub fixtures
#
# Field set chosen to cover all indicators referenced in CodeWiki §1.4 + per-slot signal logic.
# Add field = backward compat (no schema_version bump); remove/rename = breaking change.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://phoenicisnex.local/schema/marketcontext/v1"
title: "PhoenicisNex MarketContext Per-Tick Snapshot"
description: "Immutable struct passed to slot Evaluate/ManageExits per tick (FR-2.6, ADR-004)"
type: object
additionalProperties: false
required:
  - tick_time
  - bid
  - ask
  - spread_pip
  - bar_index_h4
  - ichi_h4
  - ichi_d1
  - force_h4
  - adx_h4
  - adx_d1
  - wpr_h4
  - wpr_d1
  - wpr_m15
  - bb_h4
  - dem_h4
  - dem_m15
  - stoch_m10
  - stoch_h4
  - macd_m10
  - macd_d1
  - rsi_h4
  - hull_h4
  - fractal_h4
  - zigzag_m5
  - subdem_h4
  - subdem_d1
  - bb_h4_history
  - force_h4_history
  - dem_h4_rolling
  - adx_h4_history
  - ichi_h4_history
  - derived_signals

properties:
  tick_time:
    type: string
    format: date-time
    description: "Broker server time (EET, DST-aware per C-10) of OnTick event"

  bid:
    type: number
    description: "Current bid price"

  ask:
    type: number
    description: "Current ask price"

  spread_pip:
    type: number
    minimum: 0
    description: "(ask - bid) / (_Point * DigitMultipier); used by BR-3.7 spread guard"

  bar_index_h4:
    type: integer
    minimum: 0
    description: "Current H4 bar index (Bars(EURUSD, PERIOD_H4) - 1); used by FR-8.1 cache invalidation"

  ichi_h4:
    $ref: "#/definitions/IchimokuFields"
    description: "Ichimoku H4 — used by C, D, F, J, H, K, G, GO, M, L, LX, Q, R, B, BR, BI, P, T, S"

  ichi_d1:
    $ref: "#/definitions/IchimokuFields"
    description: "Ichimoku D1 — subset slots use higher TF confirmation"

  force_h4:
    type: object
    description: "Force Index H4 — used by C, J, G, GO, M, L, B, P; ascend/descend pattern key"
    additionalProperties: false
    properties:
      f0: { type: number, description: "Latest bar Force value" }
      f1: { type: number, description: "Bar 1 ago" }
      f2: { type: number, description: "Bar 2 ago" }
      f3: { type: number, description: "Bar 3 ago — for ForcePeak3 pattern" }
      peak_pattern:
        type: string
        enum: [ascending, descending, neutral]
        description: "Derived: classification of f0..f3 sequence"

  adx_h4:
    type: object
    additionalProperties: false
    properties:
      adx: { type: number, minimum: 0 }
      di_plus: { type: number, minimum: 0 }
      di_minus: { type: number, minimum: 0 }
      adx_wave: { type: number, description: "ADXW per CodeWiki §1.4" }

  adx_d1:
    type: object
    additionalProperties: false
    properties:
      adx: { type: number, minimum: 0 }

  wpr_h4:
    type: object
    additionalProperties: false
    properties:
      wpr: { type: number, maximum: 0, minimum: -100 }
      wpr_wave: { type: number, description: "WPR wave detection per RunCheckWPRWaveWithIchimoku2" }

  wpr_d1:
    type: object
    additionalProperties: false
    properties:
      wpr: { type: number }

  wpr_m15:
    type: object
    additionalProperties: false
    properties:
      wpr: { type: number }

  bb_h4:
    type: object
    additionalProperties: false
    description: "Bollinger Bands H4 — used by R, B, BR, BI, P, T, S"
    properties:
      bb_top: { type: number }
      bb_mid: { type: number }
      bb_bot: { type: number }
      bb_width: { type: number, minimum: 0 }
      bb_ratio: { type: number, description: "Position of price within band, normalized 0..1" }

  dem_h4:
    type: object
    additionalProperties: false
    description: "DeMarker H4 — used by LX (pyramid gate), M (entry confirm)"
    properties:
      dem: { type: number, minimum: 0, maximum: 1 }

  dem_m15:
    type: object
    additionalProperties: false
    properties:
      dem: { type: number }

  stoch_m10:
    type: object
    additionalProperties: false
    description: "Stochastic M10 — used by C (ForceCutloss), L cross-confirm"
    properties:
      k_main: { type: number }
      d_signal: { type: number }

  stoch_h4:
    type: object
    additionalProperties: false
    properties:
      k_main: { type: number }
      d_signal: { type: number }

  macd_m10:
    type: object
    additionalProperties: false
    description: "MACD M10 — used by C ForceCutloss"
    properties:
      macd: { type: number }
      signal: { type: number }
      hist: { type: number }

  macd_d1:
    type: object
    additionalProperties: false
    description: "MACD D1 — used by ForceCutloss + COverload (BR-8.4)"
    properties:
      macd: { type: number }
      signal: { type: number }
      hist: { type: number }
      same_sign_loss_bars:
        type: integer
        minimum: 0
        description: "Derived: consecutive bars with same MACD sign (≥7 trigger COverload)"

  rsi_h4:
    type: object
    additionalProperties: false
    properties:
      rsi: { type: number, minimum: 0, maximum: 100 }

  hull_h4:
    type: object
    additionalProperties: false
    description: "Hull MA H4 — used by T, P (Hull-based SL anchor per BR-5.1)"
    properties:
      hull: { type: number }
      hull_slope: { type: number, description: "Derived: trend direction" }

  fractal_h4:
    type: object
    additionalProperties: false
    description: "Fractals H4 — used by G (fractal floor), K (TP target)"
    properties:
      upper_fractal: { type: [number, "null"], description: "Most recent upper fractal price; null if none recent" }
      lower_fractal: { type: [number, "null"] }

  zigzag_m5:
    type: object
    additionalProperties: false
    description: "ZigZag M5 — used by S/L wave-peak detection"
    properties:
      last_high: { type: number }
      last_low: { type: number }

  subdem_h4:
    type: object
    additionalProperties: false
    description: "SubDem custom H4 — referenced by DrawProfitTags visual hook"
    properties:
      support_zone: { type: [number, "null"] }
      demand_zone: { type: [number, "null"] }

  subdem_d1:
    type: object
    additionalProperties: false
    properties:
      support_zone: { type: [number, "null"] }
      demand_zone: { type: [number, "null"] }

  bb_h4_history:
    type: object
    additionalProperties: false
    description: "IMPL-FIX-011 Session C + IMPL-FIX-011a Fix B (2026-05-11) — 15-bar bb_top + bb_bot history for §3.6:11 + §3.7 + §3.15:5 BBTop<IchiCloudLow / BBBot>IchiCloudHigh scans"
    required: [bb_top, bb_bot, has_data]
    properties:
      bb_top:
        type: array
        items: { type: number }
        minItems: 15
        maxItems: 15
        description: "Bollinger upper band by H4 bar; series-indexed bb_top[0]=current, bb_top[14]=oldest"
      bb_bot:
        type: array
        items: { type: number }
        minItems: 15
        maxItems: 15
        description: "Bollinger lower band by H4 bar; series-indexed bb_bot[0]=current, bb_bot[14]=oldest. Added 2026-05-11 IMPL-FIX-011a Fix B for §3.15:5 SELL mirror scan."
      has_data:
        type: boolean
        description: "False if CopyBuffer short on either band/any bar (degrade-but-continue per NFR-2.2)"

  ichi_h4_history:
    type: object
    additionalProperties: false
    description: "IMPL-FIX-011a Fix B (2026-05-11) — 15-bar per-bar Ichimoku cloud edges (min/max of SenkouA/SenkouB) for §3.15:5 BBTop<CloudLow / BBBot>CloudHigh scans per CodeWiki + diagnostic § 3 row B"
    required: [cloud_low, cloud_high, has_data]
    properties:
      cloud_low:
        type: array
        items: { type: number }
        minItems: 15
        maxItems: 15
        description: "min(senkou_a[i], senkou_b[i]) per H4 bar; series-indexed [0]=current, [14]=oldest. Equivalent to legacy IchiMin per-bar."
      cloud_high:
        type: array
        items: { type: number }
        minItems: 15
        maxItems: 15
        description: "max(senkou_a[i], senkou_b[i]) per H4 bar; series-indexed. Equivalent to legacy IchiMax per-bar."
      has_data:
        type: boolean
        description: "False if CopyBuffer short on SenkouA or SenkouB (degrade-but-continue per NFR-2.2)"

  force_h4_history:
    type: object
    additionalProperties: false
    description: "IMPL-FIX-011 Session C — 8-bar Force history + peak count for §3.6:9 + §3.7:6 + §3.7:9"
    required: [force, peak_count_above11, has_data]
    properties:
      force:
        type: array
        items: { type: number }
        minItems: 8
        maxItems: 8
        description: "Force Index by H4 bar; series-indexed force[0]=current, force[7]=oldest"
      peak_count_above11:
        type: integer
        minimum: 0
        maximum: 8
        description: "Count of bars in 8-bar window where |force|>11 — §3.6:9 'no >3 prior >11 peaks'"
      has_data:
        type: boolean
        description: "False if CopyBuffer short"

  dem_h4_rolling:
    type: object
    additionalProperties: false
    description: "IMPL-FIX-011 Session C — 25-bar DEM rolling sum × 100 for §3.6:12 thresholds"
    required: [rolling_sum_x100, has_data]
    properties:
      rolling_sum_x100:
        type: number
        description: "sum(dem_h4 over last 25 bars) * 100; threshold ≥175 → BUY pending; ≤25 → SELL pending"
      has_data:
        type: boolean
        description: "False if CopyBuffer short"

  adx_h4_history:
    type: object
    additionalProperties: false
    description: "IMPL-FIX-011 Session C — 3-bar ADX/+DI/-DI buffer + adxw_no_trap flag for §3.7:5"
    required: [adx, di_plus, di_minus, adxw_no_trap_bars_1_3, has_data]
    properties:
      adx:
        type: array
        items: { type: number }
        minItems: 3
        maxItems: 3
      di_plus:
        type: array
        items: { type: number }
        minItems: 3
        maxItems: 3
      di_minus:
        type: array
        items: { type: number }
        minItems: 3
        maxItems: 3
      adxw_no_trap_bars_1_3:
        type: integer
        minimum: 0
        maximum: 1
        description: "1 if bars 1..3 do NOT trap ADX between ±DI (per §3.7:5); 0 otherwise. 'Trapped' = ADX < both di_plus AND di_minus on the bar."
      has_data:
        type: boolean

  derived_signals:
    type: object
    additionalProperties: false
    description: "Precomputed cross-slot signals (avoid per-slot recompute drift)"
    required: [wpr_wave_signal, adx_force_peak_valid]
    properties:
      wpr_wave_signal:
        type: boolean
        description: "Result of RunCheckWPRWaveWithIchimoku2 helper (cross-slot Boolean)"
      adx_force_peak_valid:
        type: boolean
        description: "Result of CheckADXWithForcePeakValid2 helper"
      ichi_double_bounce_active:
        type: boolean
        description: "Detection of OrderGroup#2 trigger pattern (BR-8.2 candidate)"

definitions:
  IchimokuFields:
    type: object
    additionalProperties: false
    required: [tenkan, kijun, senkou_a, senkou_b, chikou, cloud_high, cloud_low]
    properties:
      tenkan:
        type: array
        items: { type: number }
        minItems: 3
        description: "[bar 0, bar 1, bar 2]"
      kijun:
        type: array
        items: { type: number }
        minItems: 3
      senkou_a:
        type: array
        items: { type: number }
        minItems: 3
      senkou_b:
        type: array
        items: { type: number }
        minItems: 3
      chikou:
        type: array
        items: { type: number }
        minItems: 3
      cloud_high:
        type: number
        description: "Derived: max(senkou_a[0], senkou_b[0])"
      cloud_low:
        type: number
        description: "Derived: min(senkou_a[0], senkou_b[0])"

# TD notes:
# - Approximate struct size: ~50 fields × 8 bytes = ~720 bytes (per ADR-004 estimate)
# - Add field = no breaking; reader (slot Evaluate) tolerates missing only if field not used
# - Schema lock at SD Phase 1B; TD Phase 1D may extend per slot translation needs; bump
#   schema_version only on remove/rename
# - Trade journal indicator_snapshot field stores per-slot relevant subset (FR-4.1)
